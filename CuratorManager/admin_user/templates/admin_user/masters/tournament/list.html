{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tournament Master</title>

    {% include "admin_user/headertags.html" %}
    <link href="{% static 'admin_user/css/gradient.css' %}" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>

    <style>
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .content-card {
            width: 100%;
            max-width: 950px;
            /* background: #fff; */
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 25px 30px;
        }

        .content-card h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 20px 0;
            font-family: Arial, sans-serif;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .toolbar input, .toolbar select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .toolbar input {
            flex: 1;
            min-width: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #eee;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            font-size: 1.2em;
        }

        tr:hover td {
            background: #163d7c;
            color: white !important;
        }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
        }

        .btn-add {
            background: #2563eb;
        }

        .btn-edit {
            background: #16a34a;
            margin-right: 6px;
        }

        .btn-delete {
            background: #dc2626;
        }

        .empty-row td {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="wrapper grass-bg">
    <!-- Sidebar -->
    {% include "admin_user/menu_side.html" %}

    <div class="main-content">
        <div class="content-card" box-gradient>
            <h2>
                Tournament Master
                <a href="/usr_admin/masters/add_tournament/" class="btn btn-primary">+ Add Tournament</a>
            </h2>

            <div class="toolbar">
                <input type="text" id="searchName" placeholder="Filter by name...">
                <select id="sortOrder">
                    <option value="">-- Sort by Name --</option>
                    <option value="name">Name (A - Z)</option>
                    <option value="-name">Name (Z - A)</option>
                </select>
            </div>

            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tournament Name</th>
                        <th>Created At</th>
                        <th>Updated At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "/usr_admin/";
    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchName");
    const sortSelect = document.getElementById("sortOrder");

    function loadTournaments() {
        const params = {};
        if (searchInput.value.trim()) params.name = searchInput.value.trim();
        if (sortSelect.value) params.ordering = sortSelect.value;

        axios.get(API_URL+"tournaments", { params })
            .then(response => {
                tableBody.innerHTML = "";

                if (response.data.length === 0) {
                    tableBody.innerHTML = `<tr class="empty-row"><td colspan="5">No tournaments found</td></tr>`;
                    return;
                }

                response.data.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${new Date(item.created_at).toLocaleString()}</td>
                        <td>${new Date(item.updated_at).toLocaleString()}</td>
                        <td>
                            <a class="btn btn-primary" href="/usr_admin/masters/add_tournament/?id=${item.id}">Edit</a>
                            <button class="btn btn-danger" onclick="deleteTournament(${item.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(err => console.error("Error fetching tournaments:", err));
    }

    function deleteTournament(id) {
        if (!confirm("Are you sure you want to delete this tournament?")) return;
        axios.delete(API_URL+"tournaments/" + id + "/")
            .then(() => loadTournaments())
            .catch(err => console.error("Error deleting tournament:", err));
    }

    searchInput.addEventListener("input", loadTournaments);
    sortSelect.addEventListener("change", loadTournaments);

    loadTournaments();
</script>

</body>
</html>
