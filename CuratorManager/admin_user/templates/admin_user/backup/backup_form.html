<script>
  //  changeMenuTitle("Backup Data");
</script>
<script>
    function submitDate(event) {
      event.preventDefault();
      const csrfToken = document.getElementById('csrf_token').value;
      const type_backup = document.getElementById('type_backup').value;
      const dateValue = document.getElementById('date_input').value;
      if (!dateValue) {
        alert("Date is required");
        return;
      }

      axios.post(`/usr_admin/${type_backup=="sql"?"export-sql":"export-excel"}/`, { date: dateValue },  {
  headers: { 'X-CSRFToken': csrfToken },
  responseType: 'blob'
})
        .then(response => {
          const blob = new Blob([response.data], { type: 'application/zip' });
          const link = document.createElement('a');
          link.href = window.URL.createObjectURL(blob);
          link.download = `${type_backup=="sql"?"sql_export_by_"+dateValue+".zip":"sql_excel_by_"+dateValue+".zip"}`;
          link.click();
          loadExportLogs()
        })
        .catch(error => {
          console.error('Export failed:', error);
          alert('Failed to export data');
        });
    }
  </script>
  <script>
function loadExportLogs() {
    axios.get('/usr_admin/export-logs/')
        .then(response => {
            const logs = response.data.logs;
            const tbody = document.getElementById('exportLogBody');
            tbody.innerHTML = "";
            logs.forEach(row => {
                tbody.innerHTML += `<tr>
                    <td class="text-dark">${row.id}</td>
                    <td class="text-dark">${row.export_date}</td>
                    <td class="text-dark">${row.export_type}</td>
                    <td class="text-dark">${row.created_at}</td>
                </tr>`;
            });
        })
        .catch(error => {
            console.error('Failed to load export logs: ', error);
        });
}

// Page load par logs fetch karein
document.addEventListener('DOMContentLoaded', loadExportLogs);
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
